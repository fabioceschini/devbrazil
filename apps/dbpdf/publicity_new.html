            text-decoration: none;

			height: 30px;

            font-size: 1rem;
			text-align: left;

		.btn-title-dbmoney.coming-soon {

		/* Botão Principal direcionando para a Store */
        .btn-store-dbmoney {
            display: block;

            transition: all 0.3s ease;
			box-shadow: 0 3px 6px rgba(0,0,0,0.15);

        .btn-store-dbmoney:hover {

			/* transform: translateY(-1px); */

        .container {

            margin: 0 auto;

        p {

        }
        .bold {

        }
        .footer {

            border-top: 1px solid #eee;
            font-size: 0.9em;
        }
		
		.lang-grid-status {
			display: flex;
			justify-content: center;
			gap: 8px;

		.lang-status-item {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 0.80rem;

			color: var(--text-dark);
			background: #f9f9f9;
			padding: 5px 8px;
			border-radius: 10px;
			border: 1px solid #eee;
		}

		.lang-status-item img {
			width: 16px;
			height: 16px;
			object-fit: contain;
		}

    </style>
</head>
<body>
    <div class="container">
		<a class="btn-title-dbmoney coming-soon"

		   data-en='<img src="../../images/dbmoney_24.png" align="center">&nbsp;&nbsp;dbMoney Personal'
		   data-es='<img src="../../images/dbmoney_24.png" align="center">&nbsp;&nbsp;dbMoney Personal'
		   data-fr='<img src="../../images/dbmoney_24.png" align="center">&nbsp;&nbsp;dbMoney Personal'
		   data-de='<img src="../../images/dbmoney_24.png" align="center">&nbsp;&nbsp;dbMoney Personal'>
		</a>
	</div>
	
	<br>
			
	<div class="dbmoney-intro">
		<div class="dbmoney-text">
			<p data-pt="Oferta de Lançamento por tempo limitado! Garanta uma das <strong>500 licenças Premium vitalícias (gratuitamente)</strong> resgatando diretamente dentro do app dbMoney Personal."
			   data-en="Limited-time Launch Offer! Secure one of <strong>500 lifetime Premium licenses (for free)</strong> by claiming directly inside the dbMoney Personal app."
			   data-es="¡Oferta de Lanzamiento por tiempo limitado! Consigue una de las <strong>500 licencias Premium vitalicias (gratuitamente)</strong> canjeándola directamente dentro de la app dbMoney Personal."
			   data-fr="Offre de Lancement pour une durée limitée ! Obtenez l'une des <strong>500 licences Premium à vie (gratuitement)</strong> en la réclamant directement dans l'application dbMoney Personal."
			   data-de="Befristetes Einführungsangebot! Sichern Sie sich eine von <strong>500 lebenslangen Premium-Lizenzen (kostenlos)</strong> direkt in der dbMoney Personal App.">

		</div>			
	</div>

	<div class="container">	
	<span class="promo-badge"
		      data-pt='🔥 Lote Limitado: 500 Licenças 🔥'
		      data-en='🔥 Limited Batch: 500 Licenses 🔥'
		      data-es='🔥 Lote Limitado: 500 Licencias 🔥'
		      data-fr='🔥 Lot Limité : 500 Licences 🔥'
		      data-de='🔥 Limitierte Anzahl: 500 Lizenzen 🔥'>
		</span>		
	</div>

	<br>
	
	<img src="images/dbmoney_mini_01.png" style="display: block; margin: 0 auto;">

	<img src="images/dbmoney_mini_02.png" style="display: block; margin: 0 auto;">
	
	<hr class="linha-personalizada">

	<!--

		<img src="../../images/flag_usa_16.png">

	<!-- Botão apontando para a Microsoft Store -->
	<a href="ms-windows-store://pdp/?productid=9N0PB6XG7ZQT"
	   target="_blank"
	   class="btn-store-dbmoney"
	   data-pt='<i class="fab fa-windows"></i>&nbsp;&nbsp;&nbsp;Baixar e Resgatar no App'
	   data-en='<i class="fab fa-windows"></i>&nbsp;&nbsp;&nbsp;Download & Claim in App'
	   data-es='<i class="fab fa-windows"></i>&nbsp;&nbsp;&nbsp;Descargar y Canjear en App'
	   data-fr='<i class="fab fa-windows"></i>&nbsp;&nbsp;&nbsp;Télécharger et Obtenir dans l&#39;App'
	   data-de='<i class="fab fa-windows"></i>&nbsp;&nbsp;&nbsp;Herunterladen & in App Sichern'>
	</a>

</div>
		
<script>
	let currentImageIndex = 0;
	let currentGalleryImages = [];	
	
	function updateContent() {
		document.querySelectorAll('[data-pt]').forEach(el => {
			const texto = el.getAttribute('data-' + currentLang);
			if (texto) {
				el.innerHTML = texto;
			}
		});
		
		document.querySelectorAll('[data-placeholder-pt]').forEach(el => {
			const texto = el.getAttribute('data-placeholder-' + currentLang);
			if (texto) {
				el.placeholder = texto;
			}
		});		
		
		document.querySelectorAll('.lang-text').forEach(span => {
			if (currentLang === 'pt') span.innerText = 'en';
			else if (currentLang === 'en') span.innerText = 'es';
			else if (currentLang === 'es') span.innerText = 'fr';
			else if (currentLang === 'fr') span.innerText = 'de';
			else span.innerText = 'pt';
		});
	}

	function changeLanguage(lang) {
		currentLang = lang;
		updateContent();
	}
	
	window.addEventListener('click', function(event) {
		let galleryModal = document.getElementById("myModal");
		if (event.target == galleryModal) {
			closeModal();
		}
	});
	
	window.onload = function() {
		currentLang = 'en';
		
		const browserLang = navigator.language || navigator.userLanguage;
		
		if (browserLang.startsWith('en')) {
			currentLang = 'en';
		} else if (browserLang.startsWith('es')) {
			currentLang = 'es';
		} else if (browserLang.startsWith('fr')) {
			currentLang = 'fr';
		} else if (browserLang.startsWith('de')) {
			currentLang = 'de';
		} else if (browserLang.startsWith('pt')) {
			currentLang = 'pt';
		}
		
		checkURLForLanguage();
		changeLanguage(currentLang);		
	}

	document.addEventListener('keydown', function(e) {
		let modal = document.getElementById("myModal");
		if (modal && modal.style.display === "flex") {
			if (e.key === "ArrowLeft") changeImage(-1);
			if (e.key === "ArrowRight") changeImage(1);
			if (e.key === "Escape") closeModal();
		}
	});

    document.addEventListener("DOMContentLoaded", checkURLForLanguage);

	function scrollToSection(id) {
		const element = document.getElementById(id);
		if (element) {
			element.scrollIntoView({
				behavior: 'smooth',
				block: 'start'
			});
		}
	}
	
	function checkURLForLanguage() {	
		const hash = window.location.hash.replace('#', '');		
		const urlParams = new URLSearchParams(window.location.search);		
		const langParam = urlParams.get('lang');
		
		const validLangs = ['en', 'pt', 'es', 'fr', 'de'];
		
		if (validLangs.includes(hash)) {		
			currentLang = hash;		
		} else if (validLangs.includes(langParam)) {		
			currentLang = langParam;
		}		
	}
	
	function openModal(index, galleryId) {
		currentGalleryImages = [];
		var images = document.querySelectorAll("#" + galleryId + " img");
		for (var i = 0; i < images.length; i++) {
			currentGalleryImages.push(images[i]);
		}
    
		currentImageIndex = index;

		var modal = document.getElementById("myModal");
		var modalImg = document.getElementById("img01");
		
		if (modal && modalImg) {
			modal.style.display = "flex";
			modalImg.src = currentGalleryImages[currentImageIndex].src;
			
			updateCaption();
		}		
	}

	function closeModal() { 
		let modal = document.getElementById("myModal");
		if (modal) modal.style.display = "none"; 
	}
	
	function changeImage(step) {
		if (currentGalleryImages.length === 0) return;
    
		currentImageIndex += step;
		if (currentImageIndex >= currentGalleryImages.length) currentImageIndex = 0;
		if (currentImageIndex < 0) currentImageIndex = currentGalleryImages.length - 1;
    
		document.getElementById("img01").src = currentGalleryImages[currentImageIndex].src;
		updateCaption();
	}
	
	function updateCaption() {
		var captionText = document.getElementById("caption");
		if (captionText && currentGalleryImages[currentImageIndex]) {
			var currentImg = currentGalleryImages[currentImageIndex];
			if (typeof currentLang !== 'undefined') {
				captionText.innerText = currentImg.getAttribute('data-caption-' + currentLang) || currentImg.alt || "";
			}
		}
	}
</script>	
</body>
</html>
