<script>
	let currentImageIndex = 0;
	let currentGalleryImages = [];
	// let currentLang = 'pt';
	
	function updateContent() {
		document.querySelectorAll('[data-pt]').forEach(el => {
			const texto = el.getAttribute('data-' + currentLang);
			if (texto) {
				// USAR innerHTML para que o navegador processe as tags HTML como <strong>
				el.innerHTML = texto;
			}
		});
		
		// Atualiza placeholders
		document.querySelectorAll('[data-placeholder-pt]').forEach(el => {
			const texto = el.getAttribute('data-placeholder-' + currentLang);
			if (texto) {
				el.placeholder = texto;
			}
		});		
		
		// Atualiza as imagens/prints da galeria com base no novo escopo de idiomas
		if (typeof updateImagesByLanguage === 'function') {
			updateImagesByLanguage(currentLang);
		}
	}

	function toggleLangMenu(event) {
		event.stopPropagation();
		document.getElementById('langSelector').classList.toggle('active');
	}

	function changeLanguage(lang) {	
		currentLang = lang;
		updateContent();
		
		// Atualiza o ícone da bandeira principal no topo do site
		const flagImg = document.getElementById('currentFlag');
		if (flagImg) {
			if (lang === 'pt') {
				flagImg.src = 'images/flag_brazil_16.png'; // Garante que volta para a padrão
			} else if (lang === 'en') {
				flagImg.src = 'images/flag_usa_16.png';
			} else if (lang === 'es') {
				flagImg.src = 'images/flag_spain_16.png';
			} else if (lang === 'fr') {
				flagImg.src = 'images/flag_france_16.png';
			} else if (lang === 'de') {
				flagImg.src = 'images/flag_germany_16.png';
			}
		}
	}

	function updateImagesByLanguage(lang) {
		// Estratégia de Fallback: Se você tiver prints específicos para 'es', usa 'es'.
		// Para francês ('fr') e alemão ('de'), caso não queira inflar o pacote com novos prints,
		// o sistema utiliza a interface internacional em inglês ('en') por padrão.
		let targetSuffix = 'en';
		
		if (lang === 'pt') {
			targetSuffix = 'pt';
		} else if (lang === 'es') {
			targetSuffix = 'es';
		}

		document.querySelectorAll('.screenshot-grid img').forEach(img => {
			// A expressão regular captura os sufixos antigos e substitui com precisão cirúrgica
			img.src = img.src.replace(/_(pt|en|es|fr|de)(\.(png|jpg|jpeg|webp))/i, `_${targetSuffix}$2`);
		});
	}

	window.addEventListener('click', function(event) {
	
		// Fecha menu de idioma ao clicar fora
		const langSelector = document.getElementById('langSelector');
	
		if (!langSelector.contains(event.target)) {
			langSelector.classList.remove('active');
		}
	
		// Fecha modal da galeria
		let galleryModal = document.getElementById("myModal");
	
		if (event.target == galleryModal) {
			closeModal();
		}
	
		// Fecha modal de contato
		let contactModal = document.getElementById("contactModal");
	
		if (event.target == contactModal) {
			closeContactModal();
		}
	});

	window.onload = function() {	
		// Idioma padrão
		currentLang = 'pt';
		
		// Detecta idioma do navegador
		const browserLang = navigator.language || navigator.userLanguage;
		
		if (browserLang.startsWith('en')) {
			currentLang = 'en';
		}
		
		// Verifica URL (?lang=en ou #en)
		checkURLForLanguage();
		
		// Atualiza conteúdo
		changeLanguage(currentLang);		
	}

		// Captura apenas as imagens do card onde o usuário clicou
		currentGalleryImages = Array.from(document.querySelectorAll(`#${galleryId} img`));
		currentImageIndex = index;
    
		const modal = document.getElementById("myModal");
		const modalImg = document.getElementById("img01");
    
		modal.style.display = "flex";
		modalImg.src = currentGalleryImages[currentImageIndex].src;
	}

	function closeModal() { 
		document.getElementById("myModal").style.display = "none"; 
	}

	function changeImage(step) {
		if (currentGalleryImages.length === 0) return;
    
		currentImageIndex += step;
		if (currentImageIndex >= currentGalleryImages.length) currentImageIndex = 0;
		if (currentImageIndex < 0) currentImageIndex = currentGalleryImages.length - 1;
    
		document.getElementById("img01").src = currentGalleryImages[currentImageIndex].src;
	}

	// Fechamento e navegação via teclado
	document.addEventListener('keydown', function(e) {
		if (document.getElementById("myModal").style.display === "flex") {
			if (e.key === "ArrowLeft") changeImage(-1);
			if (e.key === "ArrowRight") changeImage(1);
			if (e.key === "Escape") closeModal();
		}
	});
	
	// Executa assim que o site carregar
    document.addEventListener("DOMContentLoaded", checkURLForLanguage);

	function openContactModal() {
	    document.getElementById("contactModal").style.display = "flex";

	function closeContactModal() {
	    document.getElementById("contactModal").style.display = "none";

	function scrollToSection(id) {

		const element = document.getElementById(id);

		if (element) {
			element.scrollIntoView({
				behavior: 'smooth',
				block: 'start'
			});
		}
	}
	
	// Função que lê o idioma da URL
    function checkURLForLanguage() {	
		const hash = window.location.hash.replace('#', '');		
		const urlParams = new URLSearchParams(window.location.search);		
		const langParam = urlParams.get('lang');
		
		// Lista com todos os 5 idiomas suportados oficialmente pelo ecossistema
		const validLangs = ['en', 'pt', 'es', 'fr', 'de'];
		
		if (validLangs.includes(hash)) {		
			currentLang = hash;		
		} else if (validLangs.includes(langParam)) {		
			currentLang = langParam;
		}
    }

	function updateImagesByLanguage(lang) {
		// Estratégia de Fallback: Se você tiver prints específicos para 'es', usa 'es'.
		// Para francês ('fr') e alemão ('de'), caso não queira inflar o pacote com novos prints,
		// o sistema utiliza a interface internacional em inglês ('en') por padrão.
		let targetSuffix = 'en';
		
		if (lang === 'pt') {
			targetSuffix = 'pt';
		} else if (lang === 'es') {
			targetSuffix = 'es';
		}

		document.querySelectorAll('.screenshot-grid img').forEach(img => {
			// A expressão regular captura os sufixos antigos e substitui com precisão cirúrgica
			img.src = img.src.replace(/_(pt|en|es|fr|de)(\.(png|jpg|jpeg|webp))/i, `_${targetSuffix}$2`);
		});
	}

	window.addEventListener('click', function(event) {
	
		// Fecha menu de idioma ao clicar fora
		const langSelector = document.getElementById('langSelector');
	
		if (!langSelector.contains(event.target)) {
			langSelector.classList.remove('active');
		}
	
		// Fecha modal da galeria
		let galleryModal = document.getElementById("myModal");
	
		if (event.target == galleryModal) {
			closeModal();
		}
	
		// Fecha modal de contato
		let contactModal = document.getElementById("contactModal");
	
		if (event.target == contactModal) {
			closeContactModal();
		}
	});

	window.onload = function() {	
		// Idioma padrão
		currentLang = 'pt';
		
		// Detecta idioma do navegador
		const browserLang = navigator.language || navigator.userLanguage;
		
		if (browserLang.startsWith('en')) {
			currentLang = 'en';
		}
		
		// Verifica URL (?lang=en ou #en)
		checkURLForLanguage();

	function openModal(index, galleryId) {

		currentGalleryImages = Array.from(document.querySelectorAll(`#${galleryId} img`));
		currentImageIndex = index;
    
		const modal = document.getElementById("myModal");
		const modalImg = document.getElementById("img01");
    
		modal.style.display = "flex";
		modalImg.src = currentGalleryImages[currentImageIndex].src;

	function closeModal() { 
		document.getElementById("myModal").style.display = "none"; 
	}

	function changeImage(step) {
		if (currentGalleryImages.length === 0) return;
    
		currentImageIndex += step;
		if (currentImageIndex >= currentGalleryImages.length) currentImageIndex = 0;
		if (currentImageIndex < 0) currentImageIndex = currentGalleryImages.length - 1;
    
		document.getElementById("img01").src = currentGalleryImages[currentImageIndex].src;

			if (e.key === "ArrowRight") changeImage(1);
			if (e.key === "Escape") closeModal();
		}
	});
