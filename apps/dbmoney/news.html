    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
		:root {
			--azul-escuro: #2B579A;
			--azul-medio: #2B579A;
			--azul-claro: #3949ab;
			--cinza-claro: #F0F0F0;
			--cinza-medio: #d6d6d6;
			--cinza-escuro: #595959;
			--verde-claro: #e8f5e9;
			--verde-escuro: #2e7d32;
			--laranja-claro: #fff3e0;
			--laranja-escuro: #ef6c00;
			--branco: #ffffff;
			--font-body: "Inter", "Segoe UI", sans-serif;
			--font-mono: "JetBrains Mono", "Consolas", monospace;	
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Calibri', Tahoma, Geneva, Verdana, sans-serif;
		}

		body {
			font-family: var(--font-body);
			background-color: var(--branco);
			color: #333;
			line-height: 1.6;}

		header {
			background-color: var(--azul-escuro);
			color: var(--branco);
			padding: 2rem;
			text-align: center;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
		}

		h1 {
			font-size: 2.0rem;
			margin-bottom: 0.5rem;
		}

		.subtitulo {
			font-size: 1.2rem;
			font-weight: 300;
			opacity: 0.9;
		}

		.container {
			max-width: 1400px;
			margin: 1rem;
			padding: 0 1rem;
		}

		.gallery-title { color: var(--azul-dbmoney); margin: 40px 0 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.4rem; }
		.screenshot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
		.screenshot-grid img { 
			width: 100%; border-radius: 8px; cursor: pointer; 
			box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.2s;
		}
		.screenshot-grid img:hover { transform: scale(1.05); }

		.secao {
			margin-bottom: 2rem;
		}

		.secao-titulo {
			color: var(--azul-escuro);
			font-size: 1.3rem;
			margin-bottom: 1.5rem;
			padding-bottom: 0.5rem;
			border-bottom: 2px solid var(--azul-claro);
		}

		/* Estilos para seção de versões */
		.versao {
			margin-bottom: 2rem;
			border-left: 2px solid var(--cinza-medio);
			padding-left: 1.5rem;
			position: relative;
		}

		.versao::before {
			margin-top: 0rem;
			content: '';
			position: absolute;
			width: 3px;
			height: 2px;
			background-color: var(--cinza-medio);
			border-radius: 10%;
			left: 0px;
			top: 10;
		}

		.versao::after {
			margin-top: -0.9rem;
			content: '';
			position: absolute;
			width: 5px;
			height: 2px;
			background-color: var(--cinza-medio);
			border-radius: 10%;
			left: -2px;
			top: 1;
		}  

		.versao-header {
			display: flex;
			align-items: center;
			margin-bottom: 1rem;
		}

		.versao-numero {
			font-size: 1.2rem;
			color: var(--azul-escuro);
			font-weight: bold;
			margin-right: 1rem;
		}

		.versao-data {
			background-color: var(--cinza-claro);
			color: var(--cinza-escuro);
			padding: 0.3rem 0.8rem;
			border-radius: 20px;
			font-size: 0.8rem;
		}

		.versao-titulo {
			font-size: 1.0rem;
			color: var(--cinza-escuro);
			margin-bottom: 1rem;
		}

		.alteracoes {
			list-style-type: none;
		}

		.alteracao-item {
			margin-bottom: 0.8rem;
			font-size: 0.9rem;
			color: var(--cinza-escuro);
			padding-left: 1.2rem;
			position: relative;
		}

		.alteracao-item::before {
			content: '■';
			position: absolute;
			left: 0;
			color: var(--azul-medio);
			font-weight: bold;
		}

		.alteracao-item-sub {
			margin-bottom: 0.8rem;
			font-size: 0.8rem;
			padding-left: 2.7rem;
			position: relative;
		}

		.alteracao-item-sub::before {
			content: '•';
			position: absolute;
			left: 1.5rem;
			color: var(--cinza-escuro);
			font-weight: bold;
		}

		.alteracao-item-sub-imagem {
			margin-bottom: 0.8rem;
			font-size: 0.8rem;
			padding-left: 2.7rem;
			position: relative;
		}

		.alteracao-item-sub-imagem::before {
			content: '•';
			position: absolute;			
			left: 1.5rem;
			top: 30%;
			color: var(--cinza-escuro);
			font-weight: bold;
		}

		.tag {
			display: inline-block;
			padding: 0.2rem 0.6rem;
			border-radius: 4px;
			font-size: 0.8rem;
			font-weight: bold;
			margin-right: 0.5rem;
		}

		.tag-novo {
			background-color: var(--verde-claro);
			color: var(--verde-escuro);
		}

		.tag-correcao {
			background-color: var(--laranja-claro);
			color: var(--laranja-escuro);
		}

		.tag-melhoria {
			background-color: #e3f2fd;
			color: #1565c0;
		}

		.tag-imagens {
			background-color: #F9E0E9;
			color: #721C38;
		}

		/* Estilos para seção de vídeos */
		.videos-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
			gap: 1.5rem;
		}

		.video-card {
			background-color: var(--cinza-claro);
			border-radius: 8px;
			overflow: hidden;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			transition: transform 0.3s ease;
		}

		.video-card:hover {
			transform: translateY(-5px);
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
		}

		.video-card:hover .video-thumbnail::after {
			background: rgba(229, 9, 20, 0.9);
			transform: scale(1.1);
		}		

		.video-thumbnail {
			position: relative;
			height: 180px;
			background-color: var(--azul-claro);
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--branco);
			font-size: 3rem;
			overflow: hidden;
		}

		.video-thumbnail::after {
			content: '▶';
			position: absolute;
			font-size: 2.2rem;
			z-index: 2;
			background: rgba(0, 0, 0, 0.6);
			width: 60px;
			height: 60px;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 50%;
			transition: background 0.2s, transform 0.2s;
		}

		.video-info {
			padding: 1rem;
		}

		.video-titulo {
			font-size: 1.1rem;
			font-weight: 600;
			margin-bottom: 0.5rem;
			color: var(--azul-escuro);
		}

		.video-data {
			font-size: 0.8rem;
			color: #666;
			margin-bottom: 0.5rem;
		}

		.video-descricao {
			font-size: 0.9rem;
			color: #444;
		}       

		footer {
			background-color: var(--azul-escuro);
			color: var(--branco);
			text-align: center;
			padding: 1.5rem;
			margin-top: 3rem;
		}
		
		
		/* --- Banner de Promoção Premium --- */
		.promo-banner {
			background: linear-gradient(135deg, #EAF0F9 0%, #A6BAD7 100%);
			color: #ffffff;
			border-radius: 8px;
			padding: 1.25rem 1.5rem;
			margin-bottom: 2rem;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1.5rem;
			box-shadow: 0 4px 12px rgba(43, 87, 154, 0.2);
			border-left: 5px solid #2B579A;
		}

		.promo-content {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}

		.promo-badge {
			align-self: flex-start;
			background-color: #2B579A;
			color: #ffffff;
			padding: 0.3rem 0.75rem;
			border-radius: 20px;
			font-size: 0.78rem;
			font-weight: bold;
			display: flex;
			align-items: center;
			gap: 0.4rem;
			letter-spacing: 0.3px;
		}

		.promo-text h3 {
			font-size: 1.2rem;
			font-weight: 700;
			color: var(--azul-escuro);
			margin: 0;
			line-height: 1.3;
		}

		.promo-text p {
			font-size: 0.88rem;
			color: var(--cinza-escuro);
			line-height: 1.4;
			margin: 0;
		}

		.promo-btn {
			background-color: #2B579A;
			color: #ffffff;
			border: none;
			padding: 0.8rem 1.4rem;
			border-radius: 6px;
			font-weight: bold;
			font-size: 0.92rem;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 0.6rem;
			white-space: nowrap;
			transition: all 0.2s ease;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
		}

		.promo-btn:hover {
			background-color: #1F3F70;
			transform: translateY(-2px);
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
		}

		/* --- REGRAS DO VOUCHER JÁ RESGATADO --- */
		.promo-claimed-msg {
			display: none;
			color: #2B579A;
			font-weight: bold;
			font-size: 0.95rem;
			align-items: center;
			gap: 0.5rem;
			background-color: rgba(255, 255, 255, 0.6);
			padding: 0.6rem 1rem;
			border-radius: 6px;
		}

		/* Se o <body> tiver a classe 'voucher-already-claimed', ajusta os elementos */
		body.voucher-already-claimed .promo-btn {
			display: none !important;
		}

		body.voucher-already-claimed .promo-claimed-msg {
			display: flex !important;
		}
		

		@media (max-width: 768px) {
			.container {
				padding: 0 1rem;
			}
			
			h1 {
				font-size: 2rem;
			}
			
			.screenshot-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
			
			.videos-grid {
				grid-template-columns: 1fr;
			}
			
			.promo-banner {
				flex-direction: column;
				align-items: flex-start;
			}
			.promo-btn {
				width: 100%;
				justify-content: center;
			}
		}
    </style>

</head>

<script>
	let currentImageIndex = 0;
	let currentGalleryImages = [];	
	let currentLang = 'en';

	function updateContent() {
		document.querySelectorAll('[data-pt]').forEach(el => {
			const texto = el.getAttribute('data-' + currentLang);
			if (texto) {
				el.innerHTML = texto;
			}
		});
		
		document.querySelectorAll('[data-placeholder-pt]').forEach(el => {
			const texto = el.getAttribute('data-placeholder-' + currentLang);
			if (texto) {
				el.placeholder = texto;
			}
		});		
		
		document.querySelectorAll('.lang-text').forEach(span => {
			if (currentLang === 'pt') span.innerText = 'en';
			else if (currentLang === 'en') span.innerText = 'es';
			else if (currentLang === 'es') span.innerText = 'fr';
			else if (currentLang === 'fr') span.innerText = 'de';
			else span.innerText = 'pt';
		});
	}

	function changeLanguage(lang) {
		currentLang = lang;
		updateContent();
	}
	
	window.addEventListener('click', function(event) {
		let galleryModal = document.getElementById("myModal");
		if (event.target == galleryModal) {
			closeModal();
		}
	});
	
	window.onload = function() {
		currentLang = 'en';
		
		const browserLang = navigator.language || navigator.userLanguage;
		if (browserLang.startsWith('en')) currentLang = 'en';
		else if (browserLang.startsWith('es')) currentLang = 'es';
		else if (browserLang.startsWith('fr')) currentLang = 'fr';
		else if (browserLang.startsWith('de')) currentLang = 'de';
		else if (browserLang.startsWith('pt')) currentLang = 'pt';
		
		checkURLForLanguage();
		changeLanguage(currentLang);
	}

	document.addEventListener('keydown', function(e) {
		if (document.getElementById("myModal").style.display === "flex") {
			if (e.key === "ArrowLeft") changeImage(-1);
			if (e.key === "ArrowRight") changeImage(1);
			if (e.key === "Escape") closeModal();
		}
	});

    document.addEventListener("DOMContentLoaded", checkURLForLanguage);

	function checkURLForLanguage() {	
		const hash = window.location.hash.replace('#', '');		
		const urlParams = new URLSearchParams(window.location.search);		
		const langParam = urlParams.get('lang');
		
		const validLangs = ['en', 'pt', 'es', 'fr', 'de'];
		
		if (validLangs.includes(hash)) {		
			currentLang = hash;		
		} else if (validLangs.includes(langParam)) {		
			currentLang = langParam;
		}		
	}
	
	function openModal(index, galleryId) {
		currentGalleryImages = [];
		var images = document.querySelectorAll("#" + galleryId + " img");
		for (var i = 0; i < images.length; i++) {
			currentGalleryImages.push(images[i]);
		}
    
		currentImageIndex = index;

		var modal = document.getElementById("myModal");
		var modalImg = document.getElementById("img01");
		
		if (modal && modalImg) {
			modal.style.display = "flex";
			modalImg.src = currentGalleryImages[currentImageIndex].src;
			updateCaption();
		}		
	}

	function closeModal() { 
		document.getElementById("myModal").style.display = "none"; 
	}
	
	function changeImage(step) {
		if (currentGalleryImages.length === 0) return;
    
		currentImageIndex += step;
		if (currentImageIndex >= currentGalleryImages.length) currentImageIndex = 0;
		if (currentImageIndex < 0) currentImageIndex = currentGalleryImages.length - 1;
    
		document.getElementById("img01").src = currentGalleryImages[currentImageIndex].src;
		updateCaption();
	}
	
	function updateCaption() {
		var captionText = document.getElementById("caption");
		if (captionText && currentGalleryImages[currentImageIndex]) {
			var currentImg = currentGalleryImages[currentImageIndex];
			if (typeof currentLang !== 'undefined') {
				captionText.innerText = currentImg.getAttribute('data-caption-' + currentLang) || currentImg.alt || "";
			}
		}
	}
	
	// Função auxiliar para comparar versões no formato "X.Y.Z"
	function compareVersions(v1, v2) {
		const parts1 = v1.split('.').map(Number);
		const parts2 = v2.split('.').map(Number);
		for (let i = 0; i < Math.max(parts1.length, parts2.length); i++) {
			const val1 = parts1[i] || 0;
			const val2 = parts2[i] || 0;
			if (val1 > val2) return 1;
			if (val1 < val2) return -1;
		}
		return 0;
	}
	
	/* --- ABERTURA DO MODAL DO TALLY & ENVIO AO DELPHI --- */
	function openFormModal() {
		const urlParams = new URLSearchParams(window.location.search);
		const currentAppVersion = urlParams.get('v') || '1.0.0';

		// Impede o resgate se a versão for menor que 1.0.12
		if (compareVersions(currentAppVersion, '1.0.12') < 0) {
			
			// Mensagens multilíngues
			const messages = {
				pt: 'Esta promoção é exclusiva para a versão 1.0.12 ou superior do dbMoney Personal. Por favor, atualize o aplicativo para resgatar.',
				en: 'This promotion is exclusive to version 1.0.12 or higher of dbMoney Personal. Please update the app to claim.',
				es: 'Esta promoción es exclusiva para la versión 1.0.12 o superior de dbMoney Personal. Por favor, actualice la aplicación para canjear.',
				fr: 'Cette promotion est exclusive à la version 1.0.12 ou supérieure de dbMoney Personal. Veuillez mettre à jour l\'application pour en profiter.',
				de: 'Aktion nur gültig ab Version 1.0.12 von dbMoney Personal. Bitte aktualisieren Sie die App, um das Angebot zu nutzen.'
			};

			// Identifica o idioma (usa a variável global currentLang ou tenta pelo navegador)
			const lang = (typeof currentLang !== 'undefined' ? currentLang : navigator.language || 'en').substring(0, 2).toLowerCase();
			
			// Exibe o alerta no idioma correspondente ou cai de volta para o inglês ('en')
			const alertMessage = messages[lang] || messages['en'];
			alert(alertMessage);
			
			return;
		}

		Tally.openPopup('2EdvOe', {
			layout: 'modal',
			width: 520,
			hideTitle: true,
			overlay: true,
			hiddenFields: {
				version: currentAppVersion
			},
			onSubmit: (payload) => {
				// 1. Avisa o EdgeBrowser/Delphi
				if (window.chrome && window.chrome.webview) {
					window.chrome.webview.postMessage('VOUCHER_CLAIMED');
				}

				// 2. Transforma o banner visualmente na hora
				document.body.classList.add('voucher-already-claimed');
			},
			onClose: () => {
				// 3. Callback disparado quando o usuário clica no "X" ou fora do modal
				if (window.chrome && window.chrome.webview) {
					window.chrome.webview.postMessage('TALLY_POPUP_CLOSED');
				}
			}
		});
	}
</script>
