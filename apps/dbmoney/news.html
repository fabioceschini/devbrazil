    <style>
		:root {
			--azul-escuro: #2B579A;
			--azul-medio: #2B579A;
			--azul-claro: #3949ab;
			--cinza-claro: #F0F0F0;
			--cinza-medio: #d6d6d6;
			--cinza-escuro: #595959;
			--verde-claro: #e8f5e9;
			--verde-escuro: #2e7d32;
			--laranja-claro: #fff3e0;
			--laranja-escuro: #ef6c00;
			--branco: #ffffff;
			--font-body: "Inter", "Segoe UI", sans-serif;
			--font-mono: "JetBrains Mono", "Consolas", monospace;	
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Calibri', Tahoma, Geneva, Verdana, sans-serif;
		}

		body {
			font-family: var(--font-body);
			background-color: var(--branco);
			color: #333;
			line-height: 1.6;}

		header {
			background-color: var(--azul-escuro);
			color: var(--branco);
			padding: 2rem;
			text-align: center;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
		}

		hr {border: 0; height: 1px; background-color: #eee; margin: 7px 0;}

		h1 {
			font-size: 2.0rem;
			margin-bottom: 0.5rem;
		}

		.subtitulo {
			font-size: 1.2rem;
			font-weight: 300;
			opacity: 0.9;
		}

		.container {
			max-width: 1400px;
			margin: 1rem;
			padding: 0 1rem;
		}

		.gallery-title { color: var(--azul-dbmoney); margin: 40px 0 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.4rem; }
		.screenshot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
		.screenshot-grid img { 
			width: 100%; border-radius: 8px; cursor: pointer; 
			box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.2s;
		}
		.screenshot-grid img:hover { transform: scale(1.05); }

		.secao {
			margin-bottom: 2.5rem;
		}

		.secao-titulo {
			color: var(--azul-escuro);
			font-size: 1.3rem;
			margin-bottom: 1.0rem;
			padding-bottom: 0.5rem;
			border-bottom: 2px solid #EEEEEE;
		}

		/* Estilos para seção de versões */
		.versao {
			margin-bottom: 2rem;
			border-left: 2px solid var(--cinza-medio);
			padding-left: 1.5rem;
			position: relative;
		}

		.versao::before {
			margin-top: 0rem;
			content: '';
			position: absolute;
			width: 3px;
			height: 2px;
			background-color: var(--cinza-medio);
			border-radius: 10%;
			left: 0px;
			top: 10;
		}

		.versao::after {
			margin-top: -0.9rem;
			content: '';
			position: absolute;
			width: 5px;
			height: 2px;
			background-color: var(--cinza-medio);
			border-radius: 10%;
			left: -2px;
			top: 1;
		}  

		.versao-header {
			display: flex;
			align-items: center;
			margin-bottom: 1rem;
		}

		.versao-numero {
			font-size: 1.2rem;
			color: var(--azul-escuro);
			font-weight: bold;
			margin-right: 1rem;
		}

		.versao-data {
			background-color: var(--cinza-claro);
			color: var(--cinza-escuro);
			padding: 0.3rem 0.8rem;
			border-radius: 20px;
			font-size: 0.8rem;
		}

		.versao-titulo {
			font-size: 1.0rem;
			color: var(--cinza-escuro);
			margin-bottom: 1rem;
		}

		.alteracoes {
			list-style-type: none;
		}

		.alteracao-item {
			margin-bottom: 0.8rem;
			font-size: 0.9rem;
			color: var(--cinza-escuro);
			padding-left: 1.2rem;
			position: relative;
		}

		.alteracao-item::before {
			content: '■';
			position: absolute;
			left: 0;
			color: var(--azul-medio);
			font-weight: bold;
		}

		.alteracao-item-sub {
			margin-bottom: 0.8rem;
			font-size: 0.9rem;
			padding-left: 2.7rem;
			position: relative;
		}

		.alteracao-item-sub::before {
			content: '•';
			position: absolute;
			left: 1.5rem;
			color: var(--cinza-escuro);
			font-weight: bold;
		}

		.alteracao-item-sub-imagem {
			margin-bottom: 0.8rem;
			font-size: 0.8rem;
			padding-left: 2.7rem;
			position: relative;
		}

		.alteracao-item-sub-imagem::before {
			content: '•';
			position: absolute;			
			left: 1.5rem;
			top: 30%;
			color: var(--cinza-escuro);
			font-weight: bold;
		}

		.tag {
			display: inline-block;
			padding: 0.2rem 0.6rem;
			border-radius: 4px;
			font-size: 0.8rem;
			font-weight: bold;
			margin-right: 0.5rem;
		}

		.tag-novo {
			background-color: var(--verde-claro);
			color: var(--verde-escuro);
		}

		.tag-correcao {
			background-color: var(--laranja-claro);
			color: var(--laranja-escuro);
		}

		.tag-melhoria {
			background-color: #e3f2fd;
			color: #1565c0;
		}

		.tag-imagens {
			background-color: #F9E0E9;
			color: #721C38;
		}

		/* Estilos para seção de vídeos */
		.videos-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
			gap: 1.5rem;
		}

		.video-card {
			background-color: var(--cinza-claro);
			border-radius: 8px;
			overflow: hidden;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			transition: transform 0.3s ease;
		}

		.video-card:hover {
			transform: translateY(-5px);
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
		}

		.video-card:hover .video-thumbnail::after {
			background: rgba(229, 9, 20, 0.9);
			transform: scale(1.1);
		}		

		.video-thumbnail {
			position: relative;
			height: 120px;
			background-color: var(--azul-claro);
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--branco);
			font-size: 2rem;
			overflow: hidden;
		}

		.video-thumbnail::after {
			content: '▶';
			position: absolute;
			font-size: 2.0rem;
			z-index: 2;
			background: rgba(0, 0, 0, 0.6);
			width: 50px;
			height: 50px;
			display: flex;
			align-items: center;
			justify-content: center;
			border-radius: 50%;
			transition: background 0.2s, transform 0.2s;
		}

		.video-info {
			padding: 0.5rem;
		}

		.video-titulo {
			font-size: 1.0rem;
			font-weight: 600;
			margin-bottom: 0rem;
			margin-left: 0.2rem;
			color: var(--azul-escuro);
		}

		.video-data {
			font-size: 0.8rem;
			color: #666;
			margin-bottom: 0rem;
			margin-left: 0.2rem;
		}

		.video-descricao {
			font-size: 0.8rem;
			color: #444;
		}       

		footer {
			background-color: var(--azul-escuro);
			color: var(--branco);
			text-align: center;
			padding: 1.5rem;
			margin-top: 3rem;		
		}

		.product-eyebrow {
			display: inline-block;
			align-items: center;
			gap: 8px;
			/*font-family: var(--font-mono);*/
			font-size: 0.8rem;
			font-weight: 600;
			letter-spacing: 0.08em;
					
			padding: 5px 8px;
			border-radius: 8px;            
			margin-left: 5px;
			line-height: 1;
			text-decoration: none;
			cursor: pointer; 
		}

		.product-eyebrow:hover {
			opacity: 0.8; /* Dá um leve efeito de piscar ao passar o mouse */
			/* Ou você pode mudar o background-color aqui */
		}		

		.eyebrow-blue {margin-left: 5px; margin-right: 5px;  margin-top: 0px; margin-bottom: 0px; color: var(--azul-dbmoney); background: rgba(0,74,153,0.08);}
		.eyebrow-red {margin-left: 0px; margin-right: 10px; margin-top: 7px; margin-bottom: 7px; color: var(--vermelho-dbpdf); background: rgba(167,80,82,0.1);}
		.eyebrow-yellow {margin-left: 0px; margin-right: 10px; margin-top: 7px; margin-bottom: 7px; color: #8a6800; background: rgba(188,141,0,0.12);}
		.eyebrow-purple {margin-left: 0px; margin-right: 10px; margin-top: 7px; margin-bottom: 7px; color: var(--roxo-dbradio); background: rgba(106,27,154,0.08);}
		.eyebrow-green {margin-left: 0px; margin-right: 5px;  margin-top: 7px; margin-bottom: 7px; color: var(--verde-dev-dark); background: rgba(27,132,91,0.1);}
		.eyebrow-gray {margin-left: 5px; margin-right: 5px;  margin-top: 0px; margin-bottom: 0px; color: #686868; background: #F2F2F2; border: 1px solid #dfdede;}
		
		@media (max-width: 768px) {
			.container {
				padding: 0 1rem;
			}
			
			h1 {
				font-size: 2rem;
			}
			
			.screenshot-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
			
			.videos-grid {
				grid-template-columns: 1fr;
			}
			
		}
    </style>

</head>

		<img id="img01" style="margin: 0 auto; display: block; max-width: 85%; max-height: 80%; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
		<div id="caption" style="margin: 15px auto 0; text-align: center; color: #ccc; font-size: 1.1rem; max-width: 80%; font-weight: 300; min-height: 25px;"></div>
		<span style="position: absolute; right: 20px; color: #f1f1f1; font-size: 50px; font-weight: bold; cursor: pointer; user-select: none; padding: 10px; z-index: 10000;" onclick="changeImage(1); event.stopPropagation();">&#10095;</span>
	</div>	

<script>
	let currentImageIndex = 0;
	let currentGalleryImages = [];	
	let currentLang = 'en';

	function updateContent() {
		document.querySelectorAll('[data-pt]').forEach(el => {
			const texto = el.getAttribute('data-' + currentLang);
			if (texto) {
				el.innerHTML = texto;
			}
		});
		
		document.querySelectorAll('[data-placeholder-pt]').forEach(el => {
			const texto = el.getAttribute('data-placeholder-' + currentLang);
			if (texto) {
				el.placeholder = texto;
			}
		});		
		
		document.querySelectorAll('.lang-text').forEach(span => {
			if (currentLang === 'pt') span.innerText = 'en';
			else if (currentLang === 'en') span.innerText = 'es';
			else if (currentLang === 'es') span.innerText = 'fr';
			else if (currentLang === 'fr') span.innerText = 'de';
			else span.innerText = 'pt';
		});
	}

	function changeLanguage(lang) {
		currentLang = lang;
		updateContent();
	}
	
	window.addEventListener('click', function(event) {
		let galleryModal = document.getElementById("myModal");
		if (event.target == galleryModal) {
			closeModal();
		}
	});
	
	window.onload = function() {
		currentLang = 'en';
		
		const browserLang = navigator.language || navigator.userLanguage;
		if (browserLang.startsWith('en')) currentLang = 'en';
		else if (browserLang.startsWith('es')) currentLang = 'es';
		else if (browserLang.startsWith('fr')) currentLang = 'fr';
		else if (browserLang.startsWith('de')) currentLang = 'de';
		else if (browserLang.startsWith('pt')) currentLang = 'pt';
		
		checkURLForLanguage();
		changeLanguage(currentLang);
	}

	document.addEventListener('keydown', function(e) {
		if (document.getElementById("myModal").style.display === "flex") {
			if (e.key === "ArrowLeft") changeImage(-1);
			if (e.key === "ArrowRight") changeImage(1);
			if (e.key === "Escape") closeModal();
		}
	});

    document.addEventListener("DOMContentLoaded", checkURLForLanguage);

	function checkURLForLanguage() {	
		const hash = window.location.hash.replace('#', '');		
		const urlParams = new URLSearchParams(window.location.search);		
		const langParam = urlParams.get('lang');
		
		const validLangs = ['en', 'pt', 'es', 'fr', 'de'];
		
		if (validLangs.includes(hash)) {		
			currentLang = hash;		
		} else if (validLangs.includes(langParam)) {		
			currentLang = langParam;
		}		
	}
	
	function openModal(index, galleryId) {
		currentGalleryImages = [];
		var images = document.querySelectorAll("#" + galleryId + " img");
		for (var i = 0; i < images.length; i++) {
			currentGalleryImages.push(images[i]);
		}
    
		currentImageIndex = index;

		var modal = document.getElementById("myModal");
		var modalImg = document.getElementById("img01");
		
		if (modal && modalImg) {
			modal.style.display = "flex";
			modalImg.src = currentGalleryImages[currentImageIndex].src;
			updateCaption();
		}		
	}

	function closeModal() { 
		document.getElementById("myModal").style.display = "none"; 
	}
	
	function changeImage(step) {
		if (currentGalleryImages.length === 0) return;
    
		currentImageIndex += step;
		if (currentImageIndex >= currentGalleryImages.length) currentImageIndex = 0;
		if (currentImageIndex < 0) currentImageIndex = currentGalleryImages.length - 1;
    
		document.getElementById("img01").src = currentGalleryImages[currentImageIndex].src;
		updateCaption();
	}
	
	function updateCaption() {
		var captionText = document.getElementById("caption");
		if (captionText && currentGalleryImages[currentImageIndex]) {
			var currentImg = currentGalleryImages[currentImageIndex];
			if (typeof currentLang !== 'undefined') {
				captionText.innerText = currentImg.getAttribute('data-caption-' + currentLang) || currentImg.alt || "";
			}
		}
	}
	
	// Função auxiliar para comparar versões no formato "X.Y.Z"
	function compareVersions(v1, v2) {
		const parts1 = v1.split('.').map(Number);
		const parts2 = v2.split('.').map(Number);
		for (let i = 0; i < Math.max(parts1.length, parts2.length); i++) {
			const val1 = parts1[i] || 0;
			const val2 = parts2[i] || 0;
			if (val1 > val2) return 1;
			if (val1 < val2) return -1;
		}
		return 0;
	}
	
</script>
	
</body>
</html>
