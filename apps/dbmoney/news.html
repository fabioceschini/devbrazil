<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBrazil | Software Engineering</title>
	<link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">	
    <style>
        :root {
            --azul-escuro: #2B579A;
            --azul-medio: #2B579A;
            --azul-claro: #3949ab;
            --cinza-claro: #F0F0F0;
            --cinza-medio: #d6d6d6;
            --cinza-escuro: #595959;
            --verde-claro: #e8f5e9;
            --verde-escuro: #2e7d32;
            --laranja-claro: #fff3e0;
            --laranja-escuro: #ef6c00;
            --branco: #ffffff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* font-family: 'Calibri', Tahoma, Geneva, Verdana, sans-serif; */
            font-family: 'Calibri', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--branco);
            color: #333;
            line-height: 1.6;
        }
        
        header {
            background-color: var(--azul-escuro);
            color: var(--branco);
            padding: 2rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 2.0rem;
            margin-bottom: 0.5rem;
        }
        
        .subtitulo {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
        }
        
        .container {
            max-width: 1400px;
            margin: 1rem;
            padding: 0 1rem;
        }

		.gallery-title { color: var(--azul-dbmoney); margin: 40px 0 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; font-size: 1.4rem; }
        .screenshot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
        .screenshot-grid img { 
            width: 100%; border-radius: 8px; cursor: pointer; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); transition: transform 0.2s;
        }
        .screenshot-grid img:hover { transform: scale(1.05); }
        
        .secao {
            margin-bottom: 3rem;
        }
        
        .secao-titulo {
            color: var(--azul-escuro);
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--azul-claro);
        }
        
        /* Estilos para seção de versões */
        .versao {
            margin-bottom: 3rem;
            border-left: 2px solid var(--cinza-medio);
            padding-left: 1.5rem;
            position: relative;
        }
        
        .versao::before {
            margin-top: 0rem;
            content: '';
            position: absolute;
            width: 3px;
            height: 2px;
            background-color: var(--cinza-medio);
            border-radius: 10%;
            left: 0px;
            top: 10;
        }

        .versao::after {
            margin-top: -0.9rem;
            content: '';
            position: absolute;
            width: 5px;
            height: 2px;
            background-color: var(--cinza-medio);
            border-radius: 10%;
            left: -2px;
            top: 1;
        }  
        
        .versao-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .versao-numero {
            font-size: 1.2rem;
            color: var(--azul-escuro);
            font-weight: bold;
            margin-right: 1rem;
        }
        
        .versao-data {
            background-color: var(--cinza-claro);
            color: var(--cinza-escuro);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        .versao-titulo {
            font-size: 1.0rem;
            color: var(--cinza-escuro);
            margin-bottom: 1rem;
        }
        
        .alteracoes {
            list-style-type: none;
        }
        
        .alteracao-item {
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
			color: var(--cinza-escuro);
            padding-left: 1.2rem;
            position: relative;
        }
        
        .alteracao-item::before {
            content: '■';
            position: absolute;
            left: 0;
            color: var(--azul-medio);
            font-weight: bold;
        }
		
        .alteracao-item-sub {
            margin-bottom: 0.8rem;
            font-size: 0.8rem;
            padding-left: 2.7rem;
            position: relative;
        }

        .alteracao-item-sub::before {
            content: '•';
            position: absolute;
			left: 1.5rem;
            color: var(--cinza-escuro);
			font-weight: bold;
		}
		
        .alteracao-item-sub-imagem {
            margin-bottom: 0.8rem;
            font-size: 0.8rem;
            padding-left: 2.7rem;
            position: relative;
        }
		
        .alteracao-item-sub-imagem::before {
            content: '•';	/* ★ */
			/* content: url("images/image-16.png"); */
			position: absolute;			
			left: 1.5rem;
			top: 30%;
            color: var(--cinza-escuro);
			font-weight: bold;
		}
        
        .tag {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 0.5rem;
        }
        
        .tag-novo {
            background-color: var(--verde-claro);
            color: var(--verde-escuro);
        }
        
        .tag-correcao {
            background-color: var(--laranja-claro);
            color: var(--laranja-escuro);
        }
        
        .tag-melhoria {
            background-color: #e3f2fd;
            color: #1565c0;
        }
		
        .tag-imagens {
            background-color: #F9E0E9;
            color: #721C38;
        }
        
        /* Estilos para seção de vídeos */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        
        .video-card {
            background-color: var(--cinza-claro);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
		
		.video-card:hover .video-thumbnail::after {
            background: rgba(229, 9, 20, 0.9); /* O play fica vermelho estilo YouTube no hover */
            transform: scale(1.1);
        }		
        
        .video-thumbnail {
            position: relative;
            height: 180px;
            background-color: var(--azul-claro);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--branco);
            font-size: 3rem;
			overflow: hidden;
        }
        
		.video-thumbnail::after {
            content: '▶';
            position: absolute;
            font-size: 2.2rem;
            z-index: 2;
            background: rgba(0, 0, 0, 0.6); /* Cria um círculo escuro sutil atrás do play */
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s, transform 0.2s;
        }
        
        .video-info {
            padding: 1rem;
        }
        
        .video-titulo {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--azul-escuro);
        }
        
        .video-data {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.5rem;
        }
        
        .video-descricao {
            font-size: 0.9rem;
            color: #444;
        }       
       
        footer {
            background-color: var(--azul-escuro);
            color: var(--branco);
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
			
			.screenshot-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
            
            .videos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

	<div id="myModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; flex-direction: column;">
		<span style="position: absolute; top: 15px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer; user-select: none; z-index: 10000;" onclick="closeModal()">&times;</span>
		<span style="position: absolute; left: 20px; color: #f1f1f1; font-size: 50px; font-weight: bold; cursor: pointer; user-select: none; padding: 10px; z-index: 10000;" onclick="changeImage(-1); event.stopPropagation();">&#10094;</span>
		<img id="img01" style="margin: 0 auto; display: block; max-width: 85%; max-height: 80%; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
		<div id="caption" style="margin: 15px auto 0; text-align: center; color: #ccc; font-size: 1.1rem; max-width: 80%; font-weight: 300; min-height: 25px;"></div>
		<span style="position: absolute; right: 20px; color: #f1f1f1; font-size: 50px; font-weight: bold; cursor: pointer; user-select: none; padding: 10px; z-index: 10000;" onclick="changeImage(1); event.stopPropagation();">&#10095;</span>
	</div>	
	
<script>
	let currentImageIndex = 0;
	let currentGalleryImages = [];	
	
	function updateContent() {
		document.querySelectorAll('[data-pt]').forEach(el => {
			const texto = el.getAttribute('data-' + currentLang);
			if (texto) {
				// USAR innerHTML para que o navegador processe o <strong>
				el.innerHTML = texto;
			}
		});
		
		// Atualiza placeholders
		document.querySelectorAll('[data-placeholder-pt]').forEach(el => {
			const texto = el.getAttribute('data-placeholder-' + currentLang);
			if (texto) {
				el.placeholder = texto;
			}
		});		
		
		// Atualiza o texto do botão de troca (Se você usar um botão cíclico, pode adaptar aqui)
		document.querySelectorAll('.lang-text').forEach(span => {
			if (currentLang === 'pt') span.innerText = 'en';
			else if (currentLang === 'en') span.innerText = 'es';
			else if (currentLang === 'es') span.innerText = 'fr';
			else if (currentLang === 'fr') span.innerText = 'de';
			else span.innerText = 'pt';
		});
	}

	function changeLanguage(lang) {
		currentLang = lang;
		// Atualiza textos
		updateContent();
	}
	
	window.addEventListener('click', function(event) {
	
		// Fecha modal da galeria
		let galleryModal = document.getElementById("myModal");
	
		if (event.target == galleryModal) {
			closeModal();
		}
	});
	
	window.onload = function() {
		// Idioma padrão
		currentLang = 'en';
		
		// Detecta idioma do navegador
		const browserLang = navigator.language || navigator.userLanguage;
		
		if (browserLang.startsWith('en')) {
			currentLang = 'en';
		} else if (browserLang.startsWith('es')) {
			currentLang = 'es';
		} else if (browserLang.startsWith('fr')) {
			currentLang = 'fr';
		} else if (browserLang.startsWith('de')) {
			currentLang = 'de';
		} else if (browserLang.startsWith('pt')) {
			currentLang = 'pt';
		}
		
		// Verifica URL (?lang= ou #)
		checkURLForLanguage();
		
		// Atualiza conteúdo
		changeLanguage(currentLang);		
	}

	document.addEventListener('keydown', function(e) {
		if (document.getElementById("myModal").style.display === "flex") {
			if (e.key === "ArrowLeft") changeImage(-1);
			if (e.key === "ArrowRight") changeImage(1);
			if (e.key === "Escape") closeModal();
		}
	});

	// Executa assim que o site carregar
    document.addEventListener("DOMContentLoaded", checkURLForLanguage);

	function scrollToSection(id) {

		const element = document.getElementById(id);

		if (element) {
			element.scrollIntoView({
				behavior: 'smooth',
				block: 'start'
			});
		}
	}
	
	// Função que lê o idioma da URL
	function checkURLForLanguage() {	
		const hash = window.location.hash.replace('#', '');		
		const urlParams = new URLSearchParams(window.location.search);		
		const langParam = urlParams.get('lang');
		
		// Lista de idiomas válidos atualizada
		const validLangs = ['en', 'pt', 'es', 'fr', 'de'];
		
		if (validLangs.includes(hash)) {		
			currentLang = hash;		
		} else if (validLangs.includes(langParam)) {		
			currentLang = langParam;
		}		
	}
	
	// Função para abrir o modal atualizada com suporte a legenda bilíngue
	//
	function openModal(index, galleryId) {
		currentGalleryImages = [];
		var images = document.querySelectorAll("#" + galleryId + " img");
		for (var i = 0; i < images.length; i++) {
			currentGalleryImages.push(images[i]);
		}
    
		currentImageIndex = index;

		var modal = document.getElementById("myModal");
		var modalImg = document.getElementById("img01");
		
		if (modal && modalImg) {
			modal.style.display = "flex";
			modalImg.src = currentGalleryImages[currentImageIndex].src;
			
			// Atualiza a legenda com base no idioma atual
			updateCaption();
		}		
	}

	function closeModal() { 
		document.getElementById("myModal").style.display = "none"; 
	}
	
	// Função de navegar imagens pelas setas ou teclado
	function changeImage(step) {
		if (currentGalleryImages.length === 0) return;
    
		currentImageIndex += step;
		if (currentImageIndex >= currentGalleryImages.length) currentImageIndex = 0;
		if (currentImageIndex < 0) currentImageIndex = currentGalleryImages.length - 1;
    
		document.getElementById("img01").src = currentGalleryImages[currentImageIndex].src;
		
		// Atualiza a legenda ao mudar de imagem
		updateCaption();
	}
	
	// Função auxiliar para definir a legenda correta no Modal
	function updateCaption() {
		var captionText = document.getElementById("caption");
		if (captionText && currentGalleryImages[currentImageIndex]) {
			var currentImg = currentGalleryImages[currentImageIndex];
			
			if (typeof currentLang !== 'undefined') {
				captionText.innerText = currentImg.getAttribute('data-caption-' + currentLang) || currentImg.alt || "";
			}
		}
	}

</script>
