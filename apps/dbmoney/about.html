<script>
	let currentLang = 'en'; // Variável global de controle

	function updateContent() {
		document.querySelectorAll('[data-pt]').forEach(el => {
			const texto = el.getAttribute('data-' + currentLang);
			if (texto) {
				// USAR innerHTML para que o navegador processe as tags HTML como <strong>
				el.innerHTML = texto;
			}
		});
		
		// Atualiza placeholders (caso existam)
		document.querySelectorAll('[data-placeholder-pt]').forEach(el => {
			const texto = el.getAttribute('data-placeholder-' + currentLang);
			if (texto) {
				el.placeholder = texto;
			}
		});		
		
		// Atualiza o texto do botão de troca ciclicamente
		document.querySelectorAll('.lang-text').forEach(span => {
			if (currentLang === 'pt') span.innerText = 'EN';
			else if (currentLang === 'en') span.innerText = 'ES';
			else if (currentLang === 'es') span.innerText = 'FR';
			else if (currentLang === 'fr') span.innerText = 'DE';
			else span.innerText = 'PT';
		});
	}

	function changeLanguage(lang) {	
		currentLang = lang;
		// Atualiza textos na tela
		updateContent();
	}
	
	window.onload = function() {
		// Idioma padrão de segurança
		currentLang = 'en';
		
		// Detecta idioma nativo do navegador do usuário
		const browserLang = navigator.language || navigator.userLanguage;
		
		if (browserLang.startsWith('en')) {
			currentLang = 'en';
		} else if (browserLang.startsWith('es')) {
			currentLang = 'es';
		} else if (browserLang.startsWith('fr')) {
			currentLang = 'fr';
		} else if (browserLang.startsWith('de')) {
			currentLang = 'de';
		} else if (browserLang.startsWith('pt')) {
			currentLang = 'pt';
		}
		
		// Verifica parâmetros adicionais na URL (?lang= ou #)
		checkURLForLanguage();
		
		// Aplica as strings do idioma selecionado
		changeLanguage(currentLang);		
	}

	// Executa a leitura da URL assim que a árvore DOM estiver pronta
    document.addEventListener("DOMContentLoaded", checkURLForLanguage);

	function scrollToSection(id) {
		const element = document.getElementById(id);
		if (element) {
			element.scrollIntoView({
				behavior: 'smooth',
				block: 'start'
			});
		}
	}
	
	// Função interna de leitura de parâmetros da URL estendida
    function checkURLForLanguage() {	
		const hash = window.location.hash.replace('#', '');		
		const urlParams = new URLSearchParams(window.location.search);		
		const langParam = urlParams.get('lang');
		
		const validLangs = ['en', 'pt', 'es', 'fr', 'de'];
		
		if (validLangs.includes(hash)) {		
			currentLang = hash;		
		} else if (validLangs.includes(langParam)) {		
			currentLang = langParam;
		}		
    }
</script>

</body>

<script>
	let currentLang = 'en'; // Variável global de controle

	function updateContent() {
		document.querySelectorAll('[data-pt]').forEach(el => {
			const texto = el.getAttribute('data-' + currentLang);
			if (texto) {
				// USAR innerHTML para que o navegador processe as tags HTML como <strong>
				el.innerHTML = texto;
			}
		});
		
		// Atualiza placeholders (caso existam)
		document.querySelectorAll('[data-placeholder-pt]').forEach(el => {
			const texto = el.getAttribute('data-placeholder-' + currentLang);
			if (texto) {
				el.placeholder = texto;
			}
		});		
		
		// Atualiza o texto do botão de troca ciclicamente
		document.querySelectorAll('.lang-text').forEach(span => {
			if (currentLang === 'pt') span.innerText = 'EN';
			else if (currentLang === 'en') span.innerText = 'ES';
			else if (currentLang === 'es') span.innerText = 'FR';
			else if (currentLang === 'fr') span.innerText = 'DE';
			else span.innerText = 'PT';
		});
	}

	function changeLanguage(lang) {	
		currentLang = lang;
		// Atualiza textos na tela
		updateContent();
	}
	
	window.onload = function() {
		// Idioma padrão de segurança
		currentLang = 'en';
		
		// Detecta idioma nativo do navegador do usuário
		const browserLang = navigator.language || navigator.userLanguage;
		
		if (browserLang.startsWith('en')) {
			currentLang = 'en';
		} else if (browserLang.startsWith('es')) {
			currentLang = 'es';
		} else if (browserLang.startsWith('fr')) {
			currentLang = 'fr';
		} else if (browserLang.startsWith('de')) {
			currentLang = 'de';
		} else if (browserLang.startsWith('pt')) {
			currentLang = 'pt';
		}
		
		// Verifica parâmetros adicionais na URL (?lang= ou #)
		checkURLForLanguage();
		
		// Aplica as strings do idioma selecionado
		changeLanguage(currentLang);		
	}

	// Executa a leitura da URL assim que a árvore DOM estiver pronta
    document.addEventListener("DOMContentLoaded", checkURLForLanguage);

	function scrollToSection(id) {
		const element = document.getElementById(id);
		if (element) {
			element.scrollIntoView({
				behavior: 'smooth',
				block: 'start'
			});
		}
	}
	
	// Função interna de leitura de parâmetros da URL estendida
    function checkURLForLanguage() {	
		const hash = window.location.hash.replace('#', '');		
		const urlParams = new URLSearchParams(window.location.search);		
		const langParam = urlParams.get('lang');
		
		const validLangs = ['en', 'pt', 'es', 'fr', 'de'];
		
		if (validLangs.includes(hash)) {		
			currentLang = hash;		
		} else if (validLangs.includes(langParam)) {		
			currentLang = langParam;
		}		
    }
</script>
